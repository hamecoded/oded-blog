# Builds and publishes the blog to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions",
# and Settings → Secrets and variables → Actions → add
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (omit both for demo mode)
#   VITE_GOOGLE_CLIENT_ID                       (optional, YouTube uploads)
# and, under Variables, VITE_ADMIN_EMAIL / VITE_BASE / VITE_OAUTH_PROVIDERS if you changed them.
# `npm run setup` does all of this for you (see DEPLOYMENT.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 15 minutes so newly published posts and new tag groups get their social-preview pages
  # (scripts/prerender.mjs). Without one, Facebook and LinkedIn show a shared link as an empty card.
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
          VITE_OAUTH_PROVIDERS: ${{ vars.VITE_OAUTH_PROVIDERS }}
          # user.github.io repos and custom domains serve from "/", project sites from "/<repo>/".
          # Override with a repository variable VITE_BASE if you use a custom domain.
          # Address used in social-preview tags (scripts/prerender.mjs).
          SITE_URL: ${{ vars.SITE_URL }}
          VITE_BASE: ${{ vars.VITE_BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
